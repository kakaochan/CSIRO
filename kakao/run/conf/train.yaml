hydra:
  job:
    name: train
  run:
    dir: ${dir.outputs_dir}/${hydra.job.name}

defaults:
  - _self_
  - dir: local

# 実験管理
exp_name: csiro_pasture_baseline
offline: false   # wandb ログ有効
seed: 42
n_splits: 5
device: auto  # auto, cuda, cpu
save_submission_df: false  # validation時のsubmission DataFrameをCSVで保存するか

# ターゲット正規化
use_target_normalization: true  # StandardScalerでターゲットを正規化（false=従来の実スケール）
scaler_path: null  # 既存scalerを使う場合はパスを指定（null=新規作成）

# データセット
dataset:
  name: original

# モデル設定
model:
  freeze_backbone: true
  name: Spec1D
  loss: weighted_smoothl1  # Regression: 'mse', 'l1'/'mae', 'smoothl1'/'huber', 'weighted_mse', 'weighted_smoothl1'
  model_ckpt: null
  final_model_path: null

  # Regression Loss parameters
  # Target weights for weighted losses (train.csv alphabetical order)
  # [Dry_Clover, Dry_Dead, Dry_Green, Dry_Total, GDM]
  # Competition R² weights: Clover=0.1, Dead=0.1, Green=0.1, Total=0.5, GDM=0.2
  # For ThreeTargetDecoder: Clover, Dead are derived from formulas, so set weight=0.0
  target_weights: [0.0, 0.0, 0.1, 0.5, 0.2]

  # SmoothL1/Huber loss beta parameter (threshold for L1 vs L2)
  smoothl1_beta: 1.0

  # V4Model specific parameters
  dropout: 0.1
  hidden_ratio: 0.35

# 特徴抽出器設定
feature_extractor:
  name: TimmBackboneExtractor
  model_name: convnext_tiny  # timm model name (e.g., convnext_tiny, resnet50, efficientnet_b0)
  pretrained: true            # Use ImageNet pretrained weights

# デコーダー設定
decoder:
  name: ThreeTargetDecoder
  dropout: 0.3  # Dropout rate for each head

# Augmentation設定
augmentation:
  mixup_alpha: 0.0
  cutmix_alpha: 0.0

# Trainer／学習ループ設定
trainer:
  lr: 1e-5  # Learning rate (lower for pretrained models)
  weight_decay: 1e-4
  optimizer: adamw
  epochs: 10
  stage1_epochs: 5
  stage2_epochs: 20
  use_warmup: false
  warmup_epochs: 3
  accelerator: auto
  use_amp: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  patience: 5

# DataLoader
train_loader:
  batch_size: 2
  shuffle: true
  num_workers: 0
  pin_memory: true
  drop_last: true

val_loader:
  batch_size: 2
  shuffle: false
  num_workers: 0
  pin_memory: true
  drop_last: false
