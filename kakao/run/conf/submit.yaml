# ============================================================
# Kaggle Submission Configuration for CSIRO Pasture Biomass
# ============================================================

# ===== Kaggle Paths =====
kaggle:
  # Test data paths (公式データセット)
  test_csv: /kaggle/input/csiro-biomass/test.csv
  test_images: /kaggle/input/csiro-biomass/test/

  # Trained model paths
  # TODO: モデルをKaggle Datasetにアップロード後、dataset名を更新してください
  # 例: /kaggle/input/your-dataset-name/csiro_pasture_baseline/
  model_dir: /kaggle/input/csiro-first-models

  # モデルファイル名（学習時に保存されるファイル名）
  model_files:
    - csiro_pasture_baseline_best_loss_fold0.pth
    - csiro_pasture_baseline_best_loss_fold1.pth
    - csiro_pasture_baseline_best_loss_fold2.pth
    - csiro_pasture_baseline_best_loss_fold3.pth
    - csiro_pasture_baseline_best_loss_fold4.pth

  # 出力パス（Kaggle working directory: 提出用CSV）
  submission_csv: /kaggle/working/submission.csv



feature_extractor:
  name: TimmBackboneExtractor
  model_name: convnext_tiny  # 学習時と同じモデル
  pretrained: false  # 推論時はfalse（重みは.pthから読み込む）

decoder:
  name: MultiHeadDecoder
  dropout: 0.3  # 学習時と同じ値

# モデル設定
model:
  name: Spec1D
  loss: mse  # Regression: 'mse', 'l1'/'mae', 'smoothl1'/'huber', 'weighted_mse', 'weighted_smoothl1'
             # Classification (legacy): 'bce', 'focal', 'combined'
  model_ckpt: null
  final_model_path: null


# ===== Inference Settings =====
inference:
  batch_size: 1  # GPU メモリに応じて調整可能
  device: cpu    # auto: 自動検出, cuda: 強制GPU, cpu: 強制CPU
  ensemble_folds: true  # true: 5-foldの平均, false: fold0のみ使用
  num_workers: 2  # DataLoaderのワーカー数

# ===== 使い方 =====
# 1. モデルファイル(.pth)をKaggle Datasetにアップロード
# 2. kaggle.model_dir のパスを更新
# 3. Kaggle Notebookで以下を実行:
#    !python /kaggle/working/CSIRO/kakao/run/submit.py
# 4. /kaggle/working/submission.csv が生成される
# 5. Kaggle の Submit ボタンで提出



# データセット
dataset:
  name: original



  # Regression Loss parameters
  # Target weights for weighted losses (competition R² weights)
  # [Dry_Green, Dry_Dead, Dry_Clover, GDM, Dry_Total]
  target_weights: [0.1, 0.1, 0.1, 0.2, 0.5]

  # SmoothL1/Huber loss beta parameter (threshold for L1 vs L2)
  smoothl1_beta: 1.0




# Augmentation設定
augmentation:
  mixup_alpha: 0.0
  cutmix_alpha: 0.0

# Trainer／学習ループ設定
trainer:
  lr: 1e-5  # Learning rate (lower for pretrained models)
  weight_decay: 1e-4
  optimizer: adamw
  epochs: 10
  use_warmup: false
  warmup_epochs: 3
  accelerator: auto
  use_amp: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  patience: 5

# DataLoader
train_loader:
  batch_size: 2
  shuffle: true
  num_workers: 0
  pin_memory: true
  drop_last: true

val_loader:
  batch_size: 2
  shuffle: false
  num_workers: 0
  pin_memory: true
  drop_last: false
